services:
  - type: web
    name: keshiyon-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: SHEETS_ENDPOINT
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
